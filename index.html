<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #60a5fa, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 35px;
            font-size: 1rem;
        }

        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .slot-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slot-window {
            background: #090d16;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            width: 80px;
            height: 100px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6), 0 0 15px rgba(59, 130, 246, 0.3);
            position: relative;
        }

        .slot-reel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            will-change: transform, filter;
            transform: translateY(0px);
            filter: blur(0px);
        }

        .slot-reel.spinning {
            transition: transform 1s cubic-bezier(0.15, 0.85, 0.15, 1), filter 0.3s ease;
            filter: blur(5px);
        }

        .slot-item {
            height: 100px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #60a5fa;
            text-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
        }

        .slot-label {
            margin-top: 8px;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .refresh-hint {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #64748b;
        }

        .badge-breakdown {
            margin-top: 30px;
            text-align: left;
            width: 100%;
            max-width: 800px;
            display: none;
        }

        .badge-breakdown h2 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #f8fafc;
            letter-spacing: 1px;
        }

        .badge-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .badge-reward {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid #3b82f6;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .badge-desc {
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>When will aliva break up with her boyfriend!!</h1>
        <p class="subtitle">Refresh to see a new day in her life.</p>

        <div class="slot-machine">
            <div class="slot-box">
                <div class="slot-window"><div class="slot-reel" id="reel-months"><div class="slot-item">0</div></div></div>
                <div class="slot-label">Months</div>
            </div>
            <div class="slot-box">
                <div class="slot-window"><div class="slot-reel" id="reel-weeks"><div class="slot-item">0</div></div></div>
                <div class="slot-label">Weeks</div>
            </div>
            <div class="slot-box">
                <div class="slot-window"><div class="slot-reel" id="reel-days"><div class="slot-item">0</div></div></div>
                <div class="slot-label">Days</div>
            </div>
            <div class="slot-box">
                <div class="slot-window"><div class="slot-reel" id="reel-hours"><div class="slot-item">0</div></div></div>
                <div class="slot-label">Hours</div>
            </div>
            <div class="slot-box">
                <div class="slot-window"><div class="slot-reel" id="reel-minutes"><div class="slot-item">0</div></div></div>
                <div class="slot-label">Minutes</div>
            </div>
        </div>

        <div class="refresh-hint">Press F5 or browser reload to roll again</div>

        <div class="badge-breakdown" id="badgeSection">
            <h2>badges that add more time..</h2>
            <div id="badgeContainer"></div>
        </div>
    </div>

    <audio id="spinAudio" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c82c2b36a7.mp3?filename=slot-machine-spin-101569.mp3" preload="auto"></audio>

    <script>
        function saveRollHistory(timeData, triggeredBadges) {
            let history = JSON.parse(localStorage.getItem('rng_roll_history') || '[]');
            history.unshift({
                timestamp: new Date().toLocaleTimeString(),
                time: timeData,
                badges: triggeredBadges
            });
            if (history.length > 20) history = history.slice(0, 20);
            localStorage.setItem('rng_roll_history', JSON.stringify(history));
        }

        function playWinSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); 
                osc.frequency.setValueAtTime(659.25, now + 0.1); 
                osc.frequency.setValueAtTime(783.99, now + 0.2); 
                osc.frequency.setValueAtTime(1046.50, now + 0.3); 
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.6);
            } catch (e) {}
        }

        function calculateTime() {
            const minMinutes = 960; 
            const maxMinutes = 300000;
            const randomFactor = Math.random();
            let rawMinutes = minMinutes + Math.floor(Math.pow(randomFactor, 2.5) * (maxMinutes - minMinutes)); 
            return rawMinutes; 
        }

        function convertMinutesToTime(totalMins) {
            let totalMinutes = totalMins;
            let minutes = totalMinutes % 60;
            let totalHours = Math.floor(totalMinutes / 60);
            let hours = totalHours % 24;
            let totalDays = Math.floor(totalHours / 24);
            let days = totalDays % 7;
            let totalWeeks = Math.floor(totalDays / 7);
            let weeks = totalWeeks % 4;
            let months = Math.floor(totalWeeks / 4);

            return { months, weeks, days, hours, minutes, totalMins };
        }

        function evaluateBadges(baseMins) {
            let badgeList = [];
            let customBadges = JSON.parse(localStorage.getItem('rng_global_badges') || '[]');
            const timeStr = baseMins.toString();

            const now = new Date();
            const dayOfWeek = now.getDay(); 
            const hour = now.getHours();
            const minute = now.getMinutes();
            const timeDecimal = hour + minute / 60;

            if (dayOfWeek === 2) {
                badgeList.push({ name: "TACO TUESDAY", desc: "IT'S TUESDAY!", timeText: "+3 DAYS 3 HOURS 3 MINUTES", mins: 4503 });
            }

            if (Math.random() < 0.1) {
                badgeList.push({ name: "BARISHAL", desc: "Her boyfriend is from barishal", timeText: "+7 DAYS", mins: 10080 });
            }

            if (timeDecimal >= (16 + 58/60) && timeDecimal <= (18 + 47/60)) {
                badgeList.push({ name: "PLACEHOLDER", desc: "ok", timeText: "+11 DAYS", mins: 15840 });
            }

            if (!timeStr.includes('0')) {
                const randomDays = Math.floor(Math.random() * 11);
                badgeList.push({ name: "VOID", desc: "CONTAINS NO ZEROS.", timeText: `+${randomDays} DAYS`, mins: randomDays * 1440 });
            }

            let counts = {};
            for (let char of timeStr) {
                counts[char] = (counts[char] || 0) + 1;
            }
            let maxFreq = 0;
            for (let digit in counts) {
                if (counts[digit] > maxFreq) maxFreq = counts[digit];
            }

            if (maxFreq === 2) {
                badgeList.push({ name: "DOUBLE TROUBLE", desc: "CONTAINS A NUMBER TWICE.", timeText: "+6 HOURS", mins: 360 });
            } else if (maxFreq === 3) {
                badgeList.push({ name: "TRIPLE STRIKE", desc: "CONTAINS A NUMBER THREE TIMES.", timeText: "+6 DAYS", mins: 8640 });
            } else if (maxFreq === 4) {
                badgeList.push({ name: "QUADRUPLE JACKPOT", desc: "CONTAINS A NUMBER FOUR TIMES.", timeText: "+17 DAYS", mins: 24480 });
            } else if (maxFreq >= 5) {
                badgeList.push({ name: "PENTA RAMPAGE", desc: "CONTAINS A NUMBER FIVE TIMES.", timeText: "+1 MONTH", mins: 43200 });
            }

            if (dayOfWeek >= 0 && dayOfWeek <= 4 && timeDecimal >= 7.0 && timeDecimal <= 15.5) {
                badgeList.push({ name: "SCHOOL TIME", desc: "She might be at school.", timeText: "+12 HOURS", mins: 720 });
            }

            if ((dayOfWeek === 5 || dayOfWeek === 6) && timeDecimal >= 19.0 && timeDecimal <= 24.0) {
                badgeList.push({ name: "BOAT CLUB", desc: "She might be at boat club", timeText: "+3 DAYS", mins: 4320 });
            }

            customBadges.forEach(cb => {
                let triggered = false;
                if (cb.conditionType === 'none') {
                    triggered = true;
                } else if (cb.conditionType === 'number' && timeStr.includes(cb.conditionParam)) {
                    triggered = true;
                } else if (cb.conditionType === 'weekday' && dayOfWeek === parseInt(cb.conditionParam)) {
                    triggered = true;
                } else if (cb.conditionType === 'chance') {
                    let prob = 1 / (parseFloat(cb.conditionParam) || 10);
                    if (Math.random() < prob) triggered = true;
                } else if (cb.conditionType === 'timerange') {
                    let parts = cb.conditionParam.split('-');
                    if (parts.length === 2) {
                        let [sH, sM] = parts[0].split(':').map(Number);
                        let [eH, eM] = parts[1].split(':').map(Number);
                        let startDec = sH + (sM || 0) / 60;
                        let endDec = eH + (eM || 0) / 60;
                        if (timeDecimal >= startDec && timeDecimal <= endDec) triggered = true;
                    }
                }

                if (triggered) {
                    badgeList.push({ name: cb.name, desc: cb.desc, timeText: cb.timeText, mins: cb.timeMins });
                }
            });

            return badgeList;
        }

        function animateSlotToValue(reelId, targetVal, maxRange) {
            const reel = document.getElementById(reelId);
            let stops = [];
            for (let i = 0; i < 6; i++) {
                stops.push(Math.floor(Math.random() * maxRange));
            }
            stops[stops.length - 1] = targetVal;

            reel.innerHTML = stops.map(val => `<div class="slot-item">${val}</div>`).join('');
            reel.style.transition = 'none';
            reel.style.transform = 'translateY(0px)';
            reel.offsetHeight; 

            reel.classList.add('spinning');
            const itemHeight = 100;
            const maxPos = (stops.length - 1) * itemHeight;
            reel.style.transform = `translateY(-${maxPos}px)`;

            setTimeout(() => {
                reel.classList.remove('spinning');
            }, 800);
        }

        window.addEventListener('DOMContentLoaded', () => {
            let currentBaseMins = calculateTime();
            let initialTime = convertMinutesToTime(currentBaseMins);

            const units = [
                { id: 'reel-months', target: initialTime.months, max: 10 },
                { id: 'reel-weeks', target: initialTime.weeks, max: 4 },
                { id: 'reel-days', target: initialTime.days, max: 7 },
                { id: 'reel-hours', target: initialTime.hours, max: 24 },
                { id: 'reel-minutes', target: initialTime.minutes, max: 60 }
            ];

            const spinAudio = document.getElementById('spinAudio');
            try {
                spinAudio.currentTime = 0;
                spinAudio.play().catch(() => {});
            } catch (e) {}

            units.forEach((unit, index) => {
                const reel = document.getElementById(unit.id);
                const totalStops = 10; 
                let stops = [];
                for (let i = 0; i < totalStops; i++) {
                    stops.push(Math.floor(Math.random() * unit.max));
                }
                stops[stops.length - 1] = unit.target;

                reel.innerHTML = stops.map(val => `<div class="slot-item">${val}</div>`).join('');

                const itemHeight = 100;
                const maxPos = (stops.length - 1) * itemHeight;

                setTimeout(() => {
                    reel.classList.add('spinning');
                    reel.style.transform = `translateY(-${maxPos}px)`;

                    setTimeout(() => {
                        reel.classList.remove('spinning');
                        reel.style.filter = 'blur(0px)';
                        if (index === units.length - 1) {
                            playWinSound();

                            setTimeout(() => {
                                const badges = evaluateBadges(currentBaseMins);
                                const badgeSection = document.getElementById('badgeSection');
                                const badgeContainer = document.getElementById('badgeContainer');
                                badgeSection.style.display = 'block';

                                let finalFinalTime = currentBaseMins;
                                badges.forEach(b => finalFinalTime += b.mins);
                                let completeTimeStruct = convertMinutesToTime(finalFinalTime);

                                saveRollHistory({
                                    months: completeTimeStruct.months,
                                    weeks: completeTimeStruct.weeks,
                                    days: completeTimeStruct.days,
                                    hours: completeTimeStruct.hours,
                                    minutes: completeTimeStruct.minutes
                                }, badges);

                                if (badges.length === 0) {
                                    badgeContainer.innerHTML = `<div class="badge-card"><div class="badge-desc" style="text-align:center;">No badges triggered on this roll.</div></div>`;
                                    return;
                                }

                                badges.forEach((badge, badgeIndex) => {
                                    setTimeout(() => {
                                        badgeContainer.innerHTML += `
                                            <div class="badge-card">
                                                <div class="badge-header">
                                                    <div class="badge-title">${badge.name}</div>
                                                    <div class="badge-reward">${badge.timeText}</div>
                                                </div>
                                                <div class="badge-desc">${badge.desc}</div>
                                            </div>
                                        `;

                                        let oldTimeStruct = convertMinutesToTime(currentBaseMins);
                                        currentBaseMins += badge.mins;
                                        let updatedTimeStruct = convertMinutesToTime(currentBaseMins);

                                        if (oldTimeStruct.months !== updatedTimeStruct.months) animateSlotToValue('reel-months', updatedTimeStruct.months, 10);
                                        if (oldTimeStruct.weeks !== updatedTimeStruct.weeks) animateSlotToValue('reel-weeks', updatedTimeStruct.weeks, 4);
                                        if (oldTimeStruct.days !== updatedTimeStruct.days) animateSlotToValue('reel-days', updatedTimeStruct.days, 7);
                                        if (oldTimeStruct.hours !== updatedTimeStruct.hours) animateSlotToValue('reel-hours', updatedTimeStruct.hours, 24);
                                        if (oldTimeStruct.minutes !== updatedTimeStruct.minutes) animateSlotToValue('reel-minutes', updatedTimeStruct.minutes, 60);

                                        playWinSound();
                                    }, badgeIndex * 2000); 
                                });

                            }, 2000); 
                        }
                    }, 1000);
                }, index * 80);
            });
        });
    </script>
</body>
</html>
